[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niyan"
version = "0.1.0"
description = "Niyan CLI — Anaconda-style SLM stack manager"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
]

[project.scripts]
niyan = "niyan.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["niyan*"]
